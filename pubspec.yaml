name: apex_clinician
description: "THE LEARNSPHERE - A modern learning platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1

  youtube_player_flutter: ^9.1.3
  youtube_player_iframe: ^5.2.1
  url_launcher: ^6.3.2
  flutter_inappwebview: ^6.1.5

  syncfusion_flutter_pdfviewer: ^33.2.13
  file_picker: ^10.3.2

  razorpay_flutter: ^1.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/


# --------------------------------------------------
# ANDROID APP ICON
# --------------------------------------------------

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/logo.png"

  adaptive_icon_background: "#020B16"
  adaptive_icon_foreground: "assets/images/logo.png"

  min_sdk_android: 21